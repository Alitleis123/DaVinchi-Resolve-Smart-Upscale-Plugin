name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # OpenCV links against these on a bare Linux runner.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the suite
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyflakes
      - name: Check for unused imports and undefined names
        run: python -m pyflakes Pipeline Stages Installer tests

  package:
    name: release build is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Building the same commit twice must produce identical archives, or the
      # checksums in update/latest.json cannot be trusted by anyone who did not
      # build them.
      - name: Build twice and compare
        run: |
          python Installer/build_release.py
          sha256sum release/*.zip > /tmp/first.txt
          python Installer/build_release.py
          sha256sum release/*.zip > /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt

      - name: Check the checksums in update/latest.json match the build
        run: |
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          meta = json.loads(Path("update/latest.json").read_text(encoding="utf-8-sig"))
          names = {"macos": "eternal2x-mac", "windows": "eternal2x-win"}
          failed = False
          for key, name in names.items():
              actual = hashlib.sha256(Path(f"release/{name}.zip").read_bytes()).hexdigest()
              if actual != meta[key]["sha256"]:
                  print(f"{key}: latest.json has {meta[key]['sha256'][:16]}, "
                        f"a fresh build gives {actual[:16]}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
